<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="title desc">
  <title id="title">Warp-Manager</title>
  <desc id="desc">Cloudflare WARP pools with independent Gemini and YouTube policies, capacity targets and hot spares. An architectural illustration, not a speed measurement.</desc>
