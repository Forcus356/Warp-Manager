name: warp-google-pool
x-worker: &worker
  build: .
  image: warp-google-pool-worker:local
  restart: unless-stopped
  cap_add: [NET_ADMIN, MKNOD, AUDIT_WRITE]
  device_cgroup_rules: ['c 10:200 rwm']
  environment:
    WARP_PROTOCOL: MASQUE
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}

services:
  warp1:
    <<: *worker
    container_name: wgp-warp1
    ports: ['127.0.0.1:41011:1080']
    volumes: ['warp1:/var/lib/cloudflare-warp']
  warp2:
    <<: *worker
    container_name: wgp-warp2
    ports: ['127.0.0.1:41012:1080']
    volumes: ['warp2:/var/lib/cloudflare-warp']
  warp3:
    <<: *worker
    container_name: wgp-warp3
    ports: ['127.0.0.1:41013:1080']
    volumes: ['warp3:/var/lib/cloudflare-warp']

volumes:
  warp1:
  warp2:
  warp3:
